openapi: 3.0.3
info:
  title: Intelligent Employee Assistant API
  version: 0.1.0
servers:
  - url: https://api.example.com
paths:
  /chat:
    post:
      summary: Chat with the assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
              required:
                - message
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
  /tasks/leave:
    post:
      summary: Submit a leave request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                reason:
                  type: string
              required:
                - start_date
                - end_date
      responses:
        '202':
          description: Request accepted
